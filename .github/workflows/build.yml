# Bouwt Claude Usage voor macOS, Windows en Ubuntu.
# Elke push en handmatige run levert downloadbare artifacts op; een tag v* maakt ook een release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bouwen (universeel) en inpakken
        run: ./macos/build.sh --package
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsage-macos
          path: macos/build/ClaudeUsage-macos.zip
      - name: Release bij een tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Jobs lopen parallel: wie de release niet als eerste aanmaakt, negeert de fout.
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "Zie de README voor installatie." 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" macos/build/ClaudeUsage-macos.zip --clobber

  tray:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ClaudeUsage-windows
            file: dist/ClaudeUsage.exe
          # 22.04: oudere glibc, zodat de build ook op nieuwere Ubuntu-versies draait.
          - os: ubuntu-22.04
            artifact: ClaudeUsage-ubuntu
            file: dist/ClaudeUsage-ubuntu.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tray
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Systeembibliotheken voor Qt (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-image0 libegl1 libdbus-1-3

      - name: Afhankelijkheden
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Tests
        run: python -m unittest discover tests -v

      - name: Bouwen
        run: pyinstaller --noconfirm --onefile --windowed --name ClaudeUsage --icon assets/icon.ico main.py

      - name: Inpakken (Ubuntu, behoudt het uitvoerrecht)
        if: runner.os == 'Linux'
        run: tar -czf dist/ClaudeUsage-ubuntu.tar.gz -C dist ClaudeUsage

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: tray/${{ matrix.file }}

      - name: Release bij een tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Jobs lopen parallel: wie de release niet als eerste aanmaakt, negeert de fout.
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "Zie de README voor installatie." 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.file }}" --clobber
